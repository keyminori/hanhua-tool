name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包
        run: |
          mkdir -p dist
          zip -r "dist/hanhua-webui-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' 'data/*' '__pycache__/*' '*.pyc' 'projects.json' 'dist/*'
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
